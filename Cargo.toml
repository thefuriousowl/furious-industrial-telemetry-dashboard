[package]
name = "furious-industrial-telemetry-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "rt-multi-thread", "net", "fs", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
